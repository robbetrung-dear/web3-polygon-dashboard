<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Portfolio Dashboard</title>
    <!-- Font Google Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Ethers.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dashboard-card {
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .network-badge {
            background: rgba(130, 71, 229, 0.15);
            border: 1px solid rgba(130, 71, 229, 0.4);
            color: #a78bfa;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .btn-connect {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
            margin-bottom: 24px;
        }

        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
        }

        .btn-connect:active {
            transform: translateY(0);
        }

        .info-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .info-box {
            background: rgba(13, 17, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
        }

        .info-label {
            font-size: 0.8rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: 500;
            color: #e5e7eb;
            word-break: break-all;
            font-family: 'Courier New', Courier, monospace;
        }

        .balance-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #34d399;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <div class="header">
            <h1 class="title">Web3 Dashboard</h1>
            <span class="network-badge">Polygon</span>
        </div>

        <button id="connectButton" class="btn-connect">Connect Wallet</button>

        <div class="info-group">
            <div class="info-box">
                <div class="info-label">Alamat Wallet</div>
                <div id="walletAddress" class="info-value">Belum terhubung</div>
            </div>

            <div class="info-box">
                <div class="info-label">Saldo POL / MATIC</div>
                <div id="walletBalance" class="balance-value">-</div>
            </div>
        </div>
    </div>

    <script>
        const connectButton = document.getElementById('connectButton');
        const walletAddress = document.getElementById('walletAddress');
        const walletBalance = document.getElementById('walletBalance');

        connectButton.addEventListener('click', async () => {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    const accounts = await provider.send("eth_requestAccounts", []);
                    const account = accounts[0];
                    
                    walletAddress.innerText = account;
                    connectButton.innerText = "Wallet Terhubung";
                    connectButton.style.background = "linear-gradient(135deg, #059669, #10b981)";

                    const balance = await provider.getBalance(account);
                    const formattedBalance = ethers.utils.formatEther(balance);
                    walletBalance.innerText = `${parseFloat(formattedBalance).toFixed(4)} POL`;

                } catch (error) {
                    console.error("Gagal terhubung atau mengambil saldo", error);
                }
            } else {
                alert("Tolong install ekstensi MetaMask terlebih dahulu!");
            }
        });
    </script>
</body>
</html>
